<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>Groceries</title>
<script src="theme.js?v=1.5.3"></script>


<link rel="stylesheet" href="style.css?v=1.5.3">  <link rel="icon" type="image/svg+xml" href="app-icon.svg?v=1.4.9">
  <link rel="icon" type="image/png" sizes="32x32" href="app-icon-32.png?v=1.4.9">
  <link rel="icon" type="image/png" sizes="16x16" href="app-icon-16.png?v=1.4.9">
  <link rel="icon" type="image/png" sizes="512x512" href="app-icon-512.png?v=1.4.9">
  <link rel="apple-touch-icon" sizes="180x180" href="app-icon-180.png?v=1.4.9">
</head>
<body>
<div class="app">
  <header>
    <h1>Groceries</h1>
    <div class="headerRight">
      <div class="fontControl">
        <button class="fontSizeBtn" id="fontSizeBtn" aria-label="Text size" aria-expanded="false">Aa</button>
        <div class="fontSizeMenu" id="fontSizeMenu" role="menu" aria-label="Text size">
          <button class="fontChoice" data-scale="1.00" role="menuitem">Small</button>
          <button class="fontChoice" data-scale="1.10" role="menuitem">Medium</button>
          <button class="fontChoice" data-scale="1.20" role="menuitem">Large</button>
          <button class="fontChoice" data-scale="1.34" role="menuitem">XL</button>
          <button class="fontChoice" data-scale="1.50" role="menuitem">XXL</button>
        </div>
      </div>
      <div class="themeControl">
        <button class="themeBtn" id="themeBtn" aria-label="Colour theme" aria-haspopup="menu" aria-expanded="false" title="Colour theme">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1"/><circle cx="7" cy="10" r="1"/><circle cx="9" cy="16" r="1"/><path d="M12 3a9 9 0 1 0 9 9c0-1.5-1-2.5-2.5-2.5h-1.3c-1.2 0-1.7-1.4-.9-2.2.9-.9.2-2.3-.5-2.9A8.9 8.9 0 0 0 12 3Z"/></svg>
        </button>
        <div class="themeMenu" id="themeMenu" role="menu" aria-label="Colour theme">
          <button class="themeChoice" data-theme-choice="original" role="menuitemradio" aria-checked="true"><span class="themeDot originalDot"></span>Original</button>
          <button class="themeChoice" data-theme-choice="nord-light" role="menuitemradio" aria-checked="false"><span class="themeDot nordLightDot"></span>Nord Light</button>
          <button class="themeChoice" data-theme-choice="nord-dark" role="menuitemradio" aria-checked="false"><span class="themeDot nordDarkDot"></span>Nord Dark</button>
          <button class="themeChoice" data-theme-choice="system" role="menuitemradio" aria-checked="false"><span class="themeDot systemDot"></span>System</button>
        </div>
      </div>
      <div class="count" id="count">0 items</div>
      <button class="statusBtn" id="familyBtn" disabled><span class="statusDot" id="statusDot"></span><span id="statusText">Connecting…</span></button>
    </div>
  </header>

  <div id="setupNotice"></div>

  <div class="composer">
    <div class="inputwrap">
      <input id="itemInput" class="itemInput" autocomplete="off" placeholder="Add an item…" aria-label="Add grocery item">
      <button id="addBtn" class="addBtn" aria-label="Add item">+</button>
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div class="quick" id="quick"></div>
    <div class="hint">Start typing, choose a suggestion, or press Return to add exactly what you typed.</div>
  </div>

  <main id="list"></main>
  <div class="appVersion" aria-label="App version">v1.5.4</div>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="config.js?v=1.4.8"></script>
<script src="grocery-catalog.js?v=1.5.2"></script>
<script src="snapshot-cache.js?v=1.5.4"></script>
<script src="app.js?v=1.5.4"></script>
</body>
</html>
