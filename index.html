<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>Groceries</title>


<link rel="stylesheet" href="style.css?v=1.4.4">

  <link rel="icon" type="image/svg+xml" href="app-icon.svg?v=1.4.4">
  <link rel="icon" type="image/png" sizes="512x512" href="app-icon-512.png?v=1.4.4">
  <link rel="apple-touch-icon" sizes="180x180" href="app-icon-180.png?v=1.4.4">
</head>
<body>
<div class="app">
  <header>
    <h1>Groceries</h1>
    <div class="headerRight">
      <div class="fontControl">
        <button class="fontSizeBtn" id="fontSizeBtn" aria-label="Text size" aria-expanded="false">Aa</button>
        <div class="fontSizeMenu" id="fontSizeMenu" role="menu" aria-label="Text size">
          <button class="fontChoice" data-scale="1.00" role="menuitem">Small</button>
          <button class="fontChoice" data-scale="1.10" role="menuitem">Medium</button>
          <button class="fontChoice" data-scale="1.20" role="menuitem">Large</button>
          <button class="fontChoice" data-scale="1.34" role="menuitem">XL</button>
          <button class="fontChoice" data-scale="1.50" role="menuitem">XXL</button>
        </div>
      </div>
      <div class="count" id="count">0 items</div>
      <button class="statusBtn" id="familyBtn"><span class="statusDot" id="statusDot"></span><span id="statusText">Demo</span></button>
    </div>
  </header>

  <div id="setupNotice"></div>

  <div class="composer">
    <div class="inputwrap">
      <input id="itemInput" class="itemInput" autocomplete="off" placeholder="Add an item…" aria-label="Add grocery item">
      <button id="addBtn" class="addBtn" aria-label="Add item">+</button>
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div class="quick" id="quick"></div>
    <div class="hint">Start typing, choose a suggestion, or press Return to add exactly what you typed.</div>
  </div>

  <main id="list"></main>
  <div class="appVersion" aria-label="App version">v1.4.4</div>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="config.js?v=1.4.4"></script>
<script src="grocery-catalog.js?v=1.4.4"></script>
<script src="app.js?v=1.4.4"></script>
</body>
</html>
