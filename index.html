<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>Groceries</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div><h1>Groceries</h1><div class="sub" id="subtitle">One list, arranged the way you shop.</div></div>
    <div class="headerRight">
      <div class="count" id="count">0 items</div>
      <button class="statusBtn" id="familyBtn"><span class="statusDot" id="statusDot"></span><span id="statusText">Demo</span></button>
    </div>
  </header>
  <div id="setupNotice"></div>
  <div class="composer">
    <div class="inputwrap">
      <input id="itemInput" class="itemInput" autocomplete="off" placeholder="Add an item…" aria-label="Add grocery item">
      <button id="addBtn" class="addBtn" aria-label="Add item">+</button>
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div class="quick" id="quick"></div>
    <div class="hint">Start typing, choose a suggestion, or press Return to add exactly what you typed.</div>
  </div>
  <main id="list"></main>
  <div class="footer" id="footer">Groceries</div>
</div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="grocery-catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
