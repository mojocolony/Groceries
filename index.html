<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>Groceries</title>
<link rel="icon" type="image/svg+xml" href="app-icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="app-icon-180.png">
<link rel="stylesheet" href="style.css?v=1.4">
</head>
<body>
<div class="app">
  <header>
    <h1>Groceries</h1>
    <div class="headerRight">
      <label class="fontPicker" aria-label="Text size">
        <span class="fontIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></span>
        <select id="fontSize" aria-label="Text size">
          <option value="0.98">Small</option>
          <option value="1.08" selected>Medium</option>
          <option value="1.18">Large</option>
          <option value="1.30">XL</option>
          <option value="1.44">XXL</option>
        </select>
      </label>
      <div class="count" id="count">0 items</div>
      <button class="statusBtn" id="familyBtn"><span class="statusDot" id="statusDot"></span><span id="statusText">Demo</span></button>
    </div>
  </header>

  <div id="setupNotice"></div>

  <div class="composer">
    <div class="inputwrap">
      <input id="itemInput" class="itemInput" autocomplete="off" placeholder="Add an item…" aria-label="Add grocery item">
      <button id="addBtn" class="addBtn" aria-label="Add item">+</button>
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div class="quick" id="quick"></div>
    <div class="hint">Start typing, choose a suggestion, or press Return to add exactly what you typed.</div>
  </div>

  <main id="list"></main>
  <div class="appVersion" aria-label="App version">v1.4</div>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="config.js?v=1.4"></script>
<script src="grocery-catalog.js?v=1.4"></script>
<script src="app.js?v=1.4"></script>
</body>
</html>
